# CV-only content for the web CV (_pages/cv.md). Publications come from
# _bibliography/papers.bib; teaching, mentoring, service and awards come from
# _data/teaching.yml and _data/service.yml. Entries are rendered by
# _includes/cv_entries.liquid (date, title, subtitle, detail, bullets, badges;
# text accepts Markdown).

research_interests:
  summary: >-
    My research focuses on high-performance computing (HPC) and AI infrastructure, with an emphasis on
    observability, resource management, and energy efficiency. Building on this systems foundation, my research
    agenda extends to AI agents for HPC operation and management, the security of agents acting within HPC
    environments, and the integration of HPC with quantum computing.
  areas:
    - "**High-performance computing:** system monitoring, workload characterization, scheduling, disaggregated memory, and energy-aware resource management."
    - "**AI infrastructure:** LLM serving, KV cache and memory management, and performance and power characterization of AI workloads."
    - "**AI agents for HPC operations:** agent-assisted cluster operation and management, including ongoing development for the NSF REPACSS system."
    - "**AI agent security in HPC:** evaluating and constraining agent behavior in shared computing environments."
    - "**HPC and quantum computing:** quantum arithmetic and polynomial synthesis, with broader interests in hybrid quantum-classical workflows and HPC integration."

