software:
  - title: "[MonSTer](https://github.com/nsfcac/MonSTer)"
    detail: Out-of-the-box HPC monitoring framework. Published at CLUSTER'20; adopted by Dell's Omnia project.
  - title: "[Disaggregation-Aware Scheduler](https://github.com/Artlands/DisaggregationAwareScheduler)"
    detail: Simulation framework for job scheduling in HPC systems with disaggregated memory. Used in CLUSTER'24 and IPDPSW'24 publications.
  - title: "[xBGAS REV-CPU](https://github.com/Artlands/rev-xbgas)"
    detail: Cycle-accurate xBGAS simulation extension based on REV-CPU. Developed with Tactical Computing Laboratories; published at ICNC'24.
  - title: "[xBGAS Runtime](https://github.com/Artlands/rev-xbgas-runtime)"
    detail: Lightweight runtime supporting global address space extensions for RISC-V-based xBGAS simulation. Developed with Tactical Computing Laboratories.

